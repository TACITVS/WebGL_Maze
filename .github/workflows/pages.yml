# Publish the demos to GitHub Pages.
#
# There is no build step: the pages are plain HTML loading ES modules, every
# path is relative (so the /WebGL_Maze/ subpath works), and the only external
# dependencies are CDN script tags. So the "build" is just uploading the repo.
name: Deploy demos to Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check every page and module the demos load actually exists
        run: node tools/check-links.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
